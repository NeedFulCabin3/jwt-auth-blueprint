name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest httpx fastapi uvicorn "passlib[bcrypt]" pyjwt email-validator

    - name: Code Syntax & Style Inspection
      run: |
        # Stop build on syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Fail build if line length or complexity standards are broken
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Validate App Module
      run: |
        python -c "import main; print('Application instance imported successfully')"
